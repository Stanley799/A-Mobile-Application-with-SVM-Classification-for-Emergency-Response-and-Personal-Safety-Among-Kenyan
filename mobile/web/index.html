<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Emergency dispatch, responder operations, and personal safety system.">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Emergency Response System">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png">
  <title>Emergency Response System</title>
  <meta name="theme-color" content="#0F766E">
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <script>
    window.GOOGLE_MAPS_API_KEY = window.GOOGLE_MAPS_API_KEY || 'AIzaSyDMEe43QvsD_f2W1yfBphggR8AmAhhCN6w';
    const mapsApiKey = window.GOOGLE_MAPS_API_KEY;
    let flutterStarted = false;

    function startFlutter() {
      if (flutterStarted) return;
      flutterStarted = true;
      const flutterBootstrap = document.createElement('script');
      flutterBootstrap.src = 'flutter_bootstrap.js';
      flutterBootstrap.async = true;
      document.body.appendChild(flutterBootstrap);
    }

    if (mapsApiKey) {
      const mapsScript = document.createElement('script');
      mapsScript.src = 'https://maps.googleapis.com/maps/api/js?key=' + encodeURIComponent(mapsApiKey) + '&loading=async&v=weekly';
      mapsScript.async = true;
      mapsScript.addEventListener('load', startFlutter, { once: true });
      mapsScript.addEventListener('error', () => {
        console.error('Google Maps failed to load. Check the key, API enablement, billing, and HTTP referrer restrictions.');
        startFlutter();
      }, { once: true });
      document.head.appendChild(mapsScript);
    } else {
      console.warn('Google Maps API key is not configured.');
      startFlutter();
    }
  </script>
</body>
</html>
